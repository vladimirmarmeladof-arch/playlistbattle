'<ellipse cx="50" cy="52" rx="40" ry="36" fill="#6EB6FF" stroke="#fff" stroke-width="4"/>'+eye(36,46,38,48)+'<path d="M56 48Q63 40 70 48"/><path d="M38 62Q50 74 62 62"/>'+tng(58,72),
gr('#FFAA5C','#fff')+gr('#FFAA5C','none')+'<path d="M33 42L43 52M43 42L33 52M57 42L67 52M67 42L57 52"/><path d="M38 62Q50 70 62 62"/>'+tng(56,70),
'<rect x="10" y="28" width="80" height="44" rx="20" fill="#fff" stroke="#fff" stroke-width="6"/><rect x="28" y="10" width="44" height="80" rx="20" fill="#fff" stroke="#fff" stroke-width="6"/><rect x="10" y="28" width="80" height="44" rx="20" fill="#A8E85C" stroke="none"/><rect x="28" y="10" width="44" height="80" rx="20" fill="#A8E85C" stroke="none"/>'+eye(38,44,38,42)+eye(62,44,62,42)+'<ellipse cx="50" cy="62" rx="6" ry="7" fill="'+MS+'" stroke="none"/>'
];
function mascot(i){return '<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="'+MS+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">'+MB[i%MB.length]+'</g></svg>'}
function av(name,i){return '<span class="av">'+mascot(i)+'</span>'}
var PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function pips(n){var h='';for(var i=0;i<9;i++)h+='<span'+(PIPS[n].indexOf(i)>-1?' class="p"':'')+'></span>';return h}
var $=document.getElementById('app');
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},1900)}
function closeOv(e){var o=document.querySelector('.ov');if(o)o.remove()}

/* ---------- intro ---------- */
function intro(){
var s=SLIDES[sl],last=sl===SLIDES.length-1,h='<div class="intro"><div class="skip"><button class="ghost sm" onclick="toMenu()">Пропустить</button></div>';
h+='<div class="slide" id="sl"><div class="ill">'+s.e+'</div><h1 style="margin-top:26px">'+s.t+'</h1><p>'+s.d+'</p></div><div class="dots">';
for(var i=0;i<SLIDES.length;i++)h+='<i class="'+(i<sl?'d':i===sl?'c':'')+'"></i>';
h+='</div><button onclick="'+(last?'toMenu()':'sl++;render()')+'">'+(last?'К игре':'Дальше')+'</button></div>';
$.innerHTML=h;
}
function toMenu(){screen='menu';render()}
function rules(){sl=0;screen='intro';render()}

/* ---------- menu ---------- */
function menu(msg){
var h='<h1 class="ttl"><span class="lbl"><span class="y">БИТВА</span><span class="p">ПЛЕЙЛИСТОВ</span></span></h1>';
h+='<div class="glass"><h2>Раунды</h2><div class="seg">'+[6,8,10,12].map(function(n){return '<button class="'+(n===CFG.rounds?'on':'')+'" onclick="CFG.rounds='+n+';jset(CK,CFG);menu()">'+n+'</button>'}).join('')+'</div></div>';
h+='<div class="glass"><h2>Игроки</h2><div class="stp"><button class="ghost" onclick="cnt(-1)">−</button><b>'+CFG.count+'</b><button class="ghost" onclick="cnt(1)">+</button></div>';
for(var i=0;i<CFG.count;i++)h+='<div class="nm">'+av(CFG.names[i]||('И'),i)+'<input maxlength="16" placeholder="Игрок '+(i+1)+'" value="'+esc(CFG.names[i]||'')+'" oninput="CFG.names['+i+']=this.value;jset(CK,CFG)"></div>';
h+='</div>';
h+='<div class="glass tg" onclick="CFG.cards=!CFG.cards;jset(CK,CFG);menu()"><div><b>'+JK+'</b><div class="mu">'+(CFG.cards?'С 3-го раунда: тема трека или особый бросок кости':'Выключены: играем без особых условий')+'</div></div><div class="sw '+(CFG.cards?'on':'')+'"><i></i></div></div>';
if(msg)h+='<div class="err">'+msg+'</div>';
h+='<button onclick="start()">Начать игру</button>';
if(saved&&saved.players)h+='<button class="ghost" onclick="S=saved;screen=\'game\';render()">Продолжить прошлую игру</button>';
h+='<button class="lnk" onclick="rules()">Правила</button>';
$.innerHTML=h;
}
function cnt(d){var n=CFG.count+d;if(n<2||n>10)return;CFG.count=n;while(CFG.names.length<n)CFG.names.push('');jset(CK,CFG);menu()}
function start(){
var names=[],i,n,k;
for(i=0;i<CFG.count;i++){n=(CFG.names[i]||'').trim()||('Игрок '+(i+1));k=2;var b=n;while(names.indexOf(n)>-1)n=b+' '+(k++);names.push(n)}
S={players:names.map(function(n){return {name:n,score:0}}),round:0,total:CFG.rounds,cards:CFG.cards,d1:shuffle(CARDS1),d2:shuffle(CARDS2),plain:0,ch:null,card:null,rolls:[],phase:'roll',tb:false,leaders:[],tbJudge:0,sel:[],guess:false,flipped:false};
screen='game';newRound();
}

/* ---------- game ---------- */
function newRound(){
S.rolls=[];S.sel=[];S.guess=false;S.card=null;S.flipped=false;S.ch=null;
if(S.cards&&S.round>=2&&!S.tb){
var want=true;
if(S.total>=8&&(S.plain||0)<2)want=Math.random()<0.5;
if(want){
var k=Math.random()<0.5?1:2,key=k===1?'d1':'d2',src=k===1?CARDS1:CARDS2;
if(!S[key]||!S[key].length)S[key]=shuffle(src);
S.card=S[key].pop();
}
}
S.plain=S.card?0:(S.plain||0)+1;
S.phase=S.card?'card':'roll';
save();render();window.scrollTo(0,0);
}
function themed(){return !!(S.card&&S.card.k===1)}
function nDice(){var c=cid();return (c==='double'||c==='sum2'||c==='choose2')?2:1}
function calc(){var r=S.rolls,c=cid();
if(c==='sum2')return r[0]+r[1];
if(c==='choose2')return S.ch;
if(c==='plus2')return r[0]+2;
if(c==='minus2')return Math.max(1,r[0]-2);
return Math.max.apply(null,r)}
function times(n){var m=n%10;return (m>=2&&m<=4&&(n<12||n>14))?'раза':'раз'}
function note(){var r=S.rolls,c=cid();
if(c==='double')return 'Берём большее из '+r.join(' и ')+'. ';
if(c==='sum2')return 'Сумма: '+r.join(' + ')+'. ';
if(c==='choose2')return 'Судья выбрал '+S.ch+' из '+r.join(' и ')+'. ';
if(c==='plus2')return 'Выпало '+r[0]+', плюс 2. ';
if(c==='minus2')return 'Выпало '+r[0]+', минус 2'+(r[0]<3?' (минимум 1)':'')+'. ';
return ''}
function how(n){var c=cid(),t=n+' '+times(n);
if(c==='right')return 'Листаем плейлист соседа справа '+t;
if(c==='judge')return 'Листаем плейлист судьи '+t;
if(c==='noshuffle')return 'Листаем подряд, с последнего добавленного: '+t;
return 'Все листают плейлист '+t}
function choose(v){S.ch=v;hap();save();game()}
function judgeIdx(){return S.tb?S.tbJudge:S.round%S.players.length}
function cid(){return S.card&&S.card.id?S.card.id:''}
function cands(){var j=judgeIdx(),r=[];S.players.forEach(function(p,i){if(i!==j&&(!S.tb||S.leaders.indexOf(i)>-1))r.push(i)});return r}
function cardHTML(c,fl,click){
return '<div class="c3'+(fl?' fl':'')+'" id="c3" style="--h:'+hc(c)+'"'+(click?' onclick="'+click+'"':'')+'><div class="ci"><div class="bk"><span class="bl"><span class="y">БИТВА</span><span class="p">ПЛЕЙЛИСТОВ</span></span></div><div class="fc"><span class="cn tl">'+c.e+'</span><span class="cn br">'+c.e+'</span><div class="art">'+c.e+'</div><div class="ct">'+c.t+'</div><div class="cd">'+c.d+'</div></div></div></div>';
}
function topbar(){
return '<div class="top"><span class="pill">'+(S.tb?'Допраунд':'Раунд '+(S.round+1)+' из '+S.total)+'</span><span><button class="ghost sm" onclick="sheet()">Очки</button><button class="ghost sm" onclick="ask()">Выйти</button></span></div>';
}
function cardScreen(){
var j=S.players[judgeIdx()].name;
$.innerHTML='<div class="rnd">'+topbar()+'<div class="stage"><div class="cdh" id="hint">'+(S.flipped?(themed()?'Тема трека: кость не бросаем':'Меняет бросок кости'):'Нажми на карту, чтобы открыть модификатор')+'</div>'+cardHTML(S.card,S.flipped,'flipCard()')+'<button id="nx" style="margin-top:22px" '+(S.flipped?'':'disabled')+' onclick="goRoll()">'+(themed()?'К выбору трека':'К броску кости')+'</button></div></div>';
}
function flipCard(){
if(S.flipped)return;S.flipped=true;hap();save();
document.getElementById('c3').classList.add('fl');
document.getElementById('nx').disabled=false;
document.getElementById('hint').textContent=themed()?'Тема трека: кость не бросаем':'Меняет бросок кости';
}
function goRoll(){S.phase='roll';save();render()}
function peek(){
var o=document.createElement('div');o.className='ov';o.onclick=closeOv;
o.innerHTML=cardHTML(S.card,true,'');document.body.appendChild(o);
}
function dice(vals,nowin){
var mx=Math.max.apply(null,vals);
return '<div class="dice">'+vals.map(function(v){return '<div class="die'+(vals.length>1?' sm':'')+(vals.length>1&&!nowin&&v===mx?' win':'')+'">'+pips(v)+'</div>'}).join('')+'</div>';
}
function game(){
if(S.phase==='final')return final();
if(S.phase==='card')return cardScreen();
var j=judgeIdx(),c=cid(),th=themed(),rolled=S.phase==='pick',two=nDice()===2,h='<div class="rnd">'+topbar()+'<div class="stage">';
var locked=false;
if(th){
h+='<div class="ill">'+S.card.e+'</div><div class="res">'+S.card.t+'<small>'+S.card.d+'. Кость не бросаем</small></div>';
}else if(rolled){
var nw=(c==='sum2'||c==='choose2');
if(c==='choose2'&&S.ch==null){
locked=true;
h+=dice(S.rolls,true)+'<div class="res">Судья выбирает кость<small>Какое число листаем?</small></div>';
S.rolls.forEach(function(v){h+='<button onclick="choose('+v+')">Листаем '+v+'</button>'});
}else{
var n=calc();
h+=dice(S.rolls,nw)+'<div class="res">'+((c==='sum2'||c==='plus2'||c==='minus2')?'Итого ':'Выпало ')+n+'<small>'+note()+how(n)+'</small></div>';
}
}else{
var who=c==='thrower'?S.players[(j+1)%S.players.length].name:'';
h+=dice(two?[6,6]:[6])+(c==='thrower'?'<div class="mu" style="text-align:center;margin-bottom:8px">Кость бросает '+esc(who)+', а не судья</div>':'')+'<button id="rb" onclick="roll()">🎲 '+(c==='thrower'?'Бросает '+esc(who):'Бросить кость')+'</button>';
}
h+='</div><div class="glass jd">'+av(S.players[j].name,j)+'<div><div class="l">Судья'+(S.tb?' допраунда':'')+'</div><div class="n">'+esc(S.players[j].name)+'</div></div></div>';
if(S.card)h+='<div class="strip" style="--h:'+hc(S.card)+'" onclick="peek()"><b>'+S.card.e+'</b>'+S.card.t+'<em>показать</em></div>';
h+='<div class="glass vote '+((rolled||th)&&!locked?'':'lock')+'"><h2>'+((rolled||th)&&!locked?'Лучший трек у кого?':(th?'':'Голосование после броска'))+'</h2>';
if(cid()==='guess')h+='<div class="chk '+(S.guess?'on':'')+'" onclick="S.guess=!S.guess;game()">'+(S.guess?'✅':'⬜')+' Судья угадал владельца (+1 судье)</div>';
h+='<div class="grid">';
cands().forEach(function(i){h+='<button class="pl '+(S.sel.indexOf(i)>-1?'on':'')+'" onclick="pick('+i+')">'+av(S.players[i].name,i)+'<span>'+esc(S.players[i].name)+'</span></button>'});
h+='</div>';
if(cid()==='split')h+='<button '+(S.sel.length===2?'':'disabled')+' onclick="award(S.sel.slice(),0.5)">Подтвердить ('+S.sel.length+'/2)</button>';
$.innerHTML=h+'</div></div>';
}
function roll(){
var times=nDice(),b=document.getElementById('rb');b.disabled=true;
var ds=document.querySelectorAll('.die');ds.forEach(function(d){d.classList.add('shake')});var k=0;
var iv=setInterval(function(){ds.forEach(function(d){d.innerHTML=pips(1+Math.floor(Math.random()*6))});k++;
if(k>13){clearInterval(iv);hap();S.rolls=[];for(var i=0;i<times;i++)S.rolls.push(1+Math.floor(Math.random()*6));S.phase='pick';save();render()}},75);
}
function pick(i){
if(cid()==='split'){var k=S.sel.indexOf(i);if(k>-1)S.sel.splice(k,1);else if(S.sel.length<2)S.sel.push(i);return game()}
award([i],cid()==='dpts'?2:1);
}
function award(ids,pts){
hap('success');ids.forEach(function(i){S.players[i].score+=pts});
var m='🏅 '+ids.map(function(i){return S.players[i].name}).join(' и ')+' +'+fmt(pts);
if(cid()==='guess'&&S.guess){S.players[judgeIdx()].score+=1;m+=' · судья +1'}
toast(m);
if(S.tb||S.round+1>=S.total){S.phase='final'}else{S.round++;return newRound()}
save();render();
}
function leaders(){var m=Math.max.apply(null,S.players.map(function(p){return p.score}));var r=[];S.players.forEach(function(p,i){if(p.score===m)r.push(i)});return r}
function tiebreak(){
var L=leaders(),n=S.players.length,j=-1;
for(var i=0;i<n;i++){if(L.indexOf(i)<0){j=i;break}}
if(j<0)j=S.round%n;
S.tb=true;S.leaders=L;S.tbJudge=j;S.round++;S.card=null;S.phase='roll';S.rolls=[];S.sel=[];save();render();
}
function reset(){S=null;try{localStorage.removeItem(KEY)}catch(e){}saved=null;screen='menu';render()}
function ask(){var f=function(ok){if(ok)reset()};if(TG&&TG.showConfirm)TG.showConfirm('Закончить игру?',f);else f(confirm('Закончить игру?'))}
function board(j){
var max=Math.max(1,Math.max.apply(null,S.players.map(function(p){return p.score})));
var h='<h2 style="margin-top:12px">Очки</h2>';
S.players.map(function(p,i){return {p:p,i:i}}).sort(function(a,b){return b.p.score-a.p.score}).forEach(function(o){
h+='<div class="row">'+av(o.p.name,o.i)+'<div class="b">'+esc(o.p.name)+(j&&o.i===judgeIdx()?' ⚖️':'')+'<div class="bar"><i style="width:'+(o.p.score/max*100)+'%"></i></div></div><b>'+fmt(o.p.score)+'</b></div>'});
return h;
}
function sheet(){
var o=document.createElement('div');o.className='ov';o.onclick=closeOv;
o.innerHTML='<div class="sh" onclick="event.stopPropagation()">'+board(true)+'<button class="ghost" onclick="closeOv()">Закрыть</button></div>';document.body.appendChild(o);
}
function confetti(){
var e=['🎉','🎶','✨','🎧','🎵','💜'],h='';
for(var i=0;i<26;i++)h+='<span class="cft" style="left:'+Math.random()*100+'%;animation-duration:'+(2.5+Math.random()*2.5)+'s;animation-delay:'+Math.random()*1.2+'s">'+e[i%e.length]+'</span>';
var d=document.createElement('div');d.innerHTML=h;document.body.appendChild(d);setTimeout(function(){d.remove()},7000);
}
function final(){
var L=leaders(),h='<h1>Итоги</h1>';
if(L.length===1){var i=L[0];h+='<div class="wcard"><span class="wbadge">'+(i+1)+'</span><div class="wtop">Победитель!</div><div class="wmas">'+mascot(i)+'</div><div class="wname">'+esc(S.players[i].name)+' 👑</div></div><div class="mu" style="text-align:center;color:var(--ink)">'+fmt(S.players[i].score)+' очк.</div><div class="glass">';setTimeout(confetti,200)}
else h+='<div class="glass"><div class="trophy">🤝</div><div class="big">Ничья</div><div class="mu" style="text-align:center">'+L.map(function(i){return esc(S.players[i].name)}).join(', ')+'</div><button onclick="tiebreak()">Дополнительный раунд</button></div><div class="glass">';
h+=board(false)+'</div><button class="ghost" onclick="reset()">В меню</button>';
$.innerHTML=h;
}
function draw(){
if(screen==='intro')return intro();
if(screen==='menu')return menu();
if(!S){screen='menu';return menu()}
game();
}
function render(){draw()}
render();
</script>
</body>
</html>
