<html lang="ru">
<head>
<meta charset="utf-8">

<title>Битва Плейлистов</title>

<style>
:root{--bg:#82b3e6;--ink:#2a2a2a;--pn:#2a2a2a;--pn2:#3b3b3b;--ln:#4a4a4a;--tx:#faf6f4;--mu:#b5b0ac;--ye:#ffb311;--pk:#ff5a8c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;line-height:1.15;margin:14px 0 8px;text-align:center;letter-spacing:-.2px;font-weight:900;font-style:italic;color:var(--ink)}
h1.ttl{display:block;background:var(--pn);border-radius:24px;padding:20px 12px 18px;margin:12px 0 16px;font-size:38px;line-height:1.05;letter-spacing:.04em;box-shadow:6px 6px 0 var(--pk)}
h1.ttl .y{color:var(--ye)}h1.ttl .p{color:var(--pk)}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--ln);font-weight:700}
.mu{color:var(--mu);font-size:14px;font-weight:400}
.glass,.sh{background:var(--pn);color:var(--tx);border-radius:16px;padding:14px;margin:12px 0}
button{font:inherit;font-weight:800;color:var(--ink);border:0;border-radius:12px;padding:14px 16px;width:100%;margin:8px 0 0;background:var(--ye);cursor:pointer;transition:transform .1s,opacity .1s}
button:active{transform:scale(.97);opacity:.85}
button.ghost{background:var(--pn);color:var(--tx)}
button.sm{width:auto;margin:0;padding:8px 14px;font-size:14px}
button:disabled{opacity:.4}
.intro{min-height:calc(100dvh - 40px);display:flex;flex-direction:column}
.skip{text-align:right}
.slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.ill{width:150px;height:150px;border-radius:32px;display:grid;place-items:center;font-size:72px;background:var(--pn);box-shadow:7px 7px 0 var(--ye);transform:rotate(-4deg)}
.slide p{font-size:17px;color:var(--ink);opacity:.85;margin:0;max-width:320px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(42,42,42,.25)}.dots i.c{background:var(--pk);transform:scale(1.3)}.dots i.d{background:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;margin:0;padding:11px;background:var(--pn2);color:var(--tx)}
.seg button.on{background:var(--ye);color:var(--ink)}
.stp{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:8px}.stp b{font-size:28px;min-width:40px;text-align:center}
.stp button{width:44px;height:44px;padding:0;font-size:24px;border-radius:50%;margin:0;background:var(--pn2);color:var(--tx)}
.nm{display:flex;align-items:center;gap:10px;margin:8px 0}
.nm input{flex:1;min-width:0;font:inherit;color:var(--tx);padding:11px 12px;border-radius:12px;border:2px solid var(--pn2);background:#1f1f1f;outline:none}
.nm input:focus{border-color:var(--ye)}
.tg{display:flex;gap:12px;align-items:center;justify-content:space-between;cursor:pointer}
.sw{flex:none;width:50px;height:30px;border-radius:30px;background:var(--pn2);position:relative;transition:.2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#faf6f4;transition:.2s}
.sw.on{background:var(--ye)}.sw.on i{left:23px}
.err{color:#8a1538;font-size:14px;font-weight:700;margin-top:8px}
.lnk{background:none;color:var(--ink);font-weight:700;opacity:.8}
.av{flex:none;width:40px;height:40px;display:block}.av svg{width:100%;height:100%;display:block;overflow:visible}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top>span:last-child{display:flex;gap:6px}
.pill{padding:7px 12px;border-radius:99px;background:var(--pn);color:var(--tx);font-size:13px;font-weight:700}
.rnd{display:flex;flex-direction:column;gap:6px;min-height:calc(100dvh - 56px)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:250px}
.dice{display:flex;gap:16px;justify-content:center;margin-bottom:12px}
.die{width:128px;height:128px;background:#faf6f4;border-radius:26px;padding:18px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);box-shadow:6px 6px 0 var(--pn)}
.die.sm{width:98px;height:98px;padding:13px;border-radius:20px;box-shadow:5px 5px 0 var(--pn)}
.die.win{box-shadow:0 0 0 4px var(--ye),6px 6px 0 4px var(--pn)}
.die span{display:grid;place-items:center}.die span.p:after{content:"";width:21px;height:21px;border-radius:50%;background:var(--pn)}.die.sm span.p:after{width:16px;height:16px}
.die.pk{cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 0 0 4px var(--ye),5px 5px 0 4px var(--pn);transition:transform .12s}.die.pk:active{transform:scale(.92)}
.die.shake{animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(10deg) translateY(-10px)}}
.res{text-align:center;font-size:26px;font-weight:900;font-style:italic;color:var(--ink)}.res small{display:block;font-size:15px;color:var(--ink);opacity:.75;font-weight:500;font-style:normal;margin-top:2px}
.stage button{max-width:300px}
.jd{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0}
.jd .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--pk);font-weight:800}.jd .n{font-size:20px;font-weight:800;line-height:1.15}
.strip{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:0;border-radius:12px;background:var(--pn);color:var(--tx);border-left:6px solid var(--h);cursor:pointer;font-weight:700;font-size:15px}
.strip b{font-size:24px}.strip em{margin-left:auto;font-style:normal;color:var(--mu);font-size:12px;font-weight:400}
.vote{margin:0;padding:12px}.vote h2{margin-bottom:10px}
.vote.lock .grid{opacity:.35;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{display:flex;align-items:center;gap:8px;margin:0;padding:9px;background:var(--pn2);color:var(--tx);text-align:left;overflow:hidden;border:2px solid transparent}
.pl .av{width:30px;height:30px;font-size:14px}.pl.on{border-color:var(--pk);background:rgba(255,90,140,.18)}
.pl span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{margin:0 0 10px;cursor:pointer}.chk.on{color:var(--ye)}
.c3{perspective:1100px;width:min(70vw,285px);aspect-ratio:5/7;margin:0 auto;cursor:pointer}
.ci{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.c3.fl .ci{transform:rotateY(180deg)}
.bk,.fc{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 30px rgba(42,42,42,.45)}
.bk{background:repeating-linear-gradient(45deg,#2a2a2a 0 8px,#323232 8px 16px);border:4px solid #faf6f4;display:grid;place-items:center}
.bk:before{content:"";position:absolute;inset:8px;border:2px solid rgba(250,246,244,.25);border-radius:12px}
.bk .bl{text-align:center;font-weight:900;font-style:italic;font-size:clamp(22px,7.5vw,30px);line-height:1.05;letter-spacing:.04em}
.bk .bl .y{color:var(--ye)}.bk .bl .p{color:var(--pk)}
.fc{transform:rotateY(180deg);background:var(--pn);color:var(--tx);border:4px solid #faf6f4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px 14px 26px;text-align:center}
.cn{position:absolute;font-size:22px;line-height:1}.cn.tl{top:9px;left:11px}.cn.br{bottom:9px;right:11px;transform:rotate(180deg)}
.art{width:60%;aspect-ratio:1;border-radius:20px;display:grid;place-items:center;font-size:clamp(54px,19vw,84px);background:var(--h);transform:rotate(-3deg)}
.ct{font-size:18px;font-weight:900;font-style:italic;line-height:1.1;letter-spacing:.02em;text-transform:uppercase;color:var(--h)}
.cd{font-size:13px;line-height:1.3;color:#e6e1dd}
.cdh{text-align:center;color:var(--ink);margin:14px 0;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(42,42,42,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.sh{width:100%;max-width:440px;max-height:85vh;overflow:auto;padding:8px 16px 16px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row .b{flex:1}.row .bar{height:6px;border-radius:6px;background:var(--pn2);margin-top:4px;overflow:hidden}.row .bar i{display:block;height:100%;border-radius:6px;background:var(--ye)}.row b{font-size:18px;min-width:30px;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pn);color:var(--tx);font-weight:800;padding:12px 20px;border-radius:99px;z-index:60;animation:in .3s both;white-space:nowrap;border:2px solid var(--ye)}
.trophy{text-align:center;font-size:64px;line-height:1.1}.big{text-align:center;font-size:28px;font-weight:900;font-style:italic}
.cft{position:fixed;top:-40px;font-size:22px;animation:fall linear forwards;pointer-events:none;z-index:70}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.glass,.sh,.pill,.die,h1.ttl{border:3px solid #111}
button{border:3px solid #111}.lnk{border:0}
.strip{border:3px solid #111;border-left:6px solid var(--h)}
.wcard{position:relative;max-width:300px;margin:22px auto 12px;background:var(--ye);border:4px solid #111;border-radius:32px;padding:16px;box-shadow:6px 6px 0 #111;animation:wpop .7s cubic-bezier(.3,1.5,.5,1) backwards}
.wtop,.wname{background:#fff;border:3px solid #111;border-radius:99px;padding:8px 14px;text-align:center;font-weight:900;color:#111}
.wtop{font-size:20px}.wname{font-size:18px}
.wmas{background:var(--pn);border:3px solid #111;border-radius:24px;margin:12px 0;padding:16px}
.wmas svg{display:block;width:70%;margin:0 auto;animation:bob 1.8s ease-in-out infinite}
.wbadge{position:absolute;top:-16px;left:-12px;width:40px;height:40px;border-radius:50%;background:#ff4d3d;border:3px solid #111;display:grid;place-items:center;font-weight:900;color:#fff;font-size:18px}
.jd .av svg{animation:bob 2.2s ease-in-out infinite}
@keyframes wpop{from{opacity:0;transform:translateY(50px) rotate(-8deg) scale(.8)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
h1.ttl{background:conic-gradient(#ff5a8c 25%,#ff7fa8 0 50%,#ff5a8c 0 75%,#ff7fa8 0) 0 0/26px 26px;padding:14px;border-radius:20px;letter-spacing:0;font-style:normal;box-shadow:6px 6px 0 #111}
.lbl,.bk .bl{display:block;background:#f5f0ea;text-align:center;font-family:'Unbounded','Arial Black',Impact,sans-serif;font-weight:900;font-style:normal;text-transform:uppercase;letter-spacing:0}
.lbl{padding:16px 10px 14px}
h1.ttl .lbl .y,h1.ttl .lbl .p,.bk .bl .y,.bk .bl .p{display:block;color:#111}
h1.ttl .lbl .y{font-size:clamp(34px,13vw,60px);line-height:1;letter-spacing:-.03em}
h1.ttl .lbl .p{font-size:clamp(16px,6.2vw,29px);line-height:1.05;letter-spacing:-.02em;margin-top:3px}
.bk{background:conic-gradient(#ff5a8c 25%,#ff7fa8 0 50%,#ff5a8c 0 75%,#ff7fa8 0) 0 0/22px 22px}.bk:before{display:none}
.bk .bl{width:84%;padding:12px 8px 10px;line-height:1}
.bk .bl .y{font-size:clamp(26px,10vw,42px);letter-spacing:-.03em}
.bk .bl .p{font-size:clamp(12px,4.7vw,20px);letter-spacing:-.02em;margin-top:3px}
.sp{--h:#D9606A}
.sp .bk{background:conic-gradient(#D9606A 25%,#E27983 0 50%,#D9606A 0 75%,#E27983 0) 0 0/22px 22px}
.sp .bk .bl{position:relative}
.sp .bk .bl .stk{position:absolute;top:-16px;right:-14px;transform:rotate(9deg);display:block;background:#26221F;color:#F6DFC9;border:3px solid #F6DFC9;padding:6px 9px 5px;font-size:11px;line-height:1.15;letter-spacing:.01em}
.sp .art{width:46%}
.sp .ct.th{font-size:24px;color:#F6DFC9;margin-top:-4px}
.pill.sk{background:#ff4d3d;color:#fff;margin-bottom:14px}
.tmh{margin:12px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.av.tm{width:auto;display:flex}.av.tm svg{width:40px;height:40px;flex:none}.av.tm svg+svg{margin-left:-16px}
.pl .av.tm{width:auto}.pl .av.tm svg{width:30px;height:30px}.pl .av.tm svg+svg{margin-left:-12px}
.wmas.tm{display:flex;justify-content:center}.wmas.tm svg{width:calc(92% / var(--n,2));margin:0}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(130,179,230,0),var(--bg) 40%)}
.dock button{display:block;max-width:448px;margin:0 auto}
.mstrip{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}.mstrip .av{width:32px;height:32px}
.nmt{margin-top:12px;padding-top:10px;border-top:1px solid var(--ln)}

/* --- треки --- */
.tw{width:100%;max-width:320px}.tw button{max-width:none}
.cv{position:relative;display:grid;place-items:center;background:var(--pn2);border:3px solid #111;border-radius:16px;overflow:hidden;aspect-ratio:1;font-size:40px;line-height:1;flex:none}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trk{display:flex;align-items:center;gap:12px;background:var(--pn);color:var(--tx);border:3px solid #111;border-radius:16px;padding:10px;margin:12px 0 0;width:100%}
.trk .cv{width:72px;border-radius:12px}
.trk div{min-width:0;overflow-wrap:anywhere}.trk b{display:block;font-size:17px;line-height:1.2}.trk .a{display:block;color:var(--mu);font-size:14px;margin-top:2px}
.wname.tr{border-radius:20px;line-height:1.2;overflow-wrap:anywhere}.wname.tr .ar{font-size:14px;font-weight:600;opacity:.7;margin-top:2px}
.hrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.hrow .cv{width:52px;font-size:22px;border-width:2px;border-radius:12px}
.hrow>div:last-child{flex:1;min-width:0;overflow-wrap:anywhere}
.hw{font-size:13px;font-weight:700;margin-top:3px}.hw.ps{color:var(--ye)}.hw.ng{color:#ff7a6e}.hw i{font-style:normal;color:var(--mu);font-weight:400}
.hrow a{color:inherit}
.nt{font-size:14px;font-weight:700;margin-top:8px;line-height:1.3}
.egg{position:absolute;top:-24px;right:-6px;z-index:3;font-weight:900;font-size:17px;white-space:nowrap;color:#fff44f;text-shadow:2px 2px 0 #111,-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111;transform:rotate(14deg);animation:egg .45s ease-in-out infinite alternate;pointer-events:none}
@keyframes egg{from{transform:rotate(14deg) scale(1)}to{transform:rotate(14deg) scale(1.12)}}

/* ===== REDESIGN: плоский «стикерный» стиль, палитра прежняя ===== */
:root{--ft:'Unbounded','Arial Black',Impact,sans-serif;--ol:4px solid #111;--ck:repeating-conic-gradient(#2a2a2a 0 25%,#333 0 50%) 0 0/36px 36px}
h1,h2,.res,.big,.jd .n,.jd .l,.pill,.toast,.ct,.wtop,.wname,.hw,button{font-family:var(--ft);font-style:normal;text-transform:uppercase;letter-spacing:0}
h1{font-size:22px}
h2{font-size:11px;letter-spacing:.06em;border-bottom:3px solid var(--ye);display:inline-block;padding-bottom:5px;color:var(--ye)}
.res{font-size:22px;line-height:1.1}.res small,.mu,.cd,.slide p,.trk .a,.wname.tr .ar{font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;text-transform:none}
.glass,.sh,.pill,h1.ttl,button,.strip,.trk,.cv,.nm input,.toast{border-width:4px}
.glass,.sh{border-radius:30px;padding:18px}
h1.ttl{border-radius:30px;box-shadow:none}
button{border-radius:99px;font-size:14px;padding:15px 18px;letter-spacing:.02em}
button.ghost{background:transparent;color:var(--tx);border-color:var(--tx)}
.dock button,.stage button{box-shadow:none}
.seg button{border-radius:99px}.seg button.on{background:var(--ye)}
.stp button{border-width:3px;border-color:var(--tx);font-family:-apple-system,system-ui,sans-serif}
.nm input{border-radius:99px;border-color:#111;background:#1f1f1f;padding:12px 16px}.nm input:focus{border-color:var(--ye)}
.pill{padding:8px 14px}
.ill{box-shadow:none;border:var(--ol);border-radius:36px;background:var(--ck);width:170px;height:170px}
/* карточка судьи: тёмная шапка с маскотом + жёлтая панель, как в референсе */
.jd{background:var(--ye);color:#111;border-radius:30px;padding:14px 16px;gap:14px}
.jd .av{width:64px;height:64px}
.jd .l{color:#111;opacity:.65;font-size:10px;letter-spacing:.08em}.jd .n{font-size:18px}.jd .mu{color:#111;opacity:.7}
.strip{border-radius:99px;background:var(--pn);padding:10px 16px;border-left-width:4px}
.vote{background:var(--pn)}
.pl{border-radius:22px;border-width:3px;border-color:#111;font-family:-apple-system,system-ui,sans-serif;text-transform:none;font-weight:800}
.pl.on{border-color:var(--pk);background:rgba(255,90,140,.22)}
.chk.on{color:var(--ye)}
/* карты */
.bk,.fc{border-width:4px;border-color:#111;border-radius:30px;box-shadow:none}
.fc{background:var(--ck)}
.fc .ct{font-size:16px;line-height:1.15}
.art{border:var(--ol);border-radius:28px;transform:rotate(-3deg)}
/* победитель */
.wcard{border-radius:36px;box-shadow:none;border-width:4px;padding:18px}
.wtop,.wname{border-width:4px}
.wmas{border-width:4px;border-radius:28px}
.wbadge{border-width:4px;width:44px;height:44px}
.trk{border-radius:28px;background:var(--pn)}.trk .cv{border-radius:18px}
.ov .sh{border-color:#111}
.row .bar{height:10px;border:2px solid #111}.row .bar i{background:var(--ye)}
.toast{border-color:#111;background:var(--ye);color:#111}
.dots i{width:10px;height:10px;border:2px solid #111;background:transparent}.dots i.c{background:var(--pk)}.dots i.d{background:#111}
.dock{background:linear-gradient(rgba(130,179,230,0),var(--bg) 45%)}
/* --- фикс: верхняя панель и экран трека --- */
.top{flex-wrap:nowrap}
.top .pill{white-space:nowrap;font-size:11px;padding:9px 12px;border-width:3px}
.top>span:last-child{flex:none}
button.sm{font-size:11px;padding:9px 13px;border-width:3px}
.pill{display:inline-block;line-height:1.2}
.pill.sk{margin-bottom:10px}
.tw .res{margin:12px 0 16px!important}

.nm{gap:8px}

.nm input::placeholder{font-size:14px;color:#8d8884}

.tw>button{margin-top:10px}
</style>

<script>
var JK='Модификаторы'; /* так называются карточки-особенности: поменяй здесь */
/* Тип 1: тема трека, кость не бросается. Тип 2: меняет бросок кости. */
var CARDS1=[
{e:'🆕',t:'Свежее в плейлисте',d:'Ставь трек, который добавил(а) недавно'},
{e:'❤️',t:'Самый любимый',d:'Ставь трек, который любишь больше всего'},
{e:'😳',t:'Гилти плежер',d:'Ставь трек, за который немного стыдно'},
{e:'🕰',t:'Старше 2010 года',d:'Только треки, вышедшие до 2010-го'},

function jsonp(url){return new Promise(function(ok,no){
var cb='jp'+Date.now()+Math.floor(Math.random()*1e5),sc=document.createElement('script');
function clean(){clearTimeout(tm);delete window[cb];sc.remove()}

window[cb]=function(d){clean();ok(d)};
sc.onerror=function(){clean();no(new Error('Не удалось связаться с сервисом. Впишите трек вручную'))};
sc.src=url+'&callback='+cb;document.head.appendChild(sc)})}

return fetch(url,c?{signal:c.signal}:{}).then(function(r){clearTimeout(tm);return r},function(e){clearTimeout(tm);throw e})}

function apple(u){
var id=u.searchParams.get('i');
if(!id){var m=u.pathname.match(/\/song\/(?:[^\/]+\/)?(\d+)/);id=m&&m[1]}
if(!id)return Promise.reject(new Error('Нужна ссылка на трек, а не на альбом. В Apple Music нажмите «Поделиться» у песни'));
var cc=u.pathname.split('/')[1]||'';cc=/^[a-z]{2}$/i.test(cc)?cc:'ru';
return look(id,cc).then(function(r){return r||(cc!=='us'?look(id,'us'):null)}).then(function(r){
if(!r||!r.trackName)throw new Error('Трек не найден. Проверьте ссылку или впишите вручную');
return {title:r.trackName,artist:r.artistName||'',cover:(r.artworkUrl100||'').replace(/\d+x\d+bb/,'600x600bb'),url:u.href}})}
function spot(u){return fetchT('https://open.spotify.com/oembed?url='+encodeURIComponent(u.href)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
if(!d||!d.title)throw 0;return {title:d.title,artist:'',cover:d.thumbnail_url||'',url:u.href}})}
function odesli(u){
var bad=new Error('Не удалось получить трек по ссылке. Впишите «Артист — Трек» вручную');
return fetchT('https://api.song.link/v1-alpha.1/links?userCountry=RU&url='+encodeURIComponent(u.href)).then(function(r){
if(r.status===429)throw new Error('Слишком много запросов. Подождите минуту или впишите трек вручную');
if(!r.ok)throw bad;return r.json()}).then(function(d){
var e=d.entitiesByUniqueId&&d.entitiesByUniqueId[d.entityUniqueId];
if(!e||!e.title)throw bad;
if(e.type&&e.type!=='song')throw new Error('Нужна ссылка на трек, а не на альбом или плейлист');
return {title:e.title,artist:e.artistName||'',cover:e.thumbnailUrl||'',url:u.href}
}).catch(function(err){
if(/spotify\.com$/.test(u.hostname)&&err!==bad&&!/запросов|альбом/.test(err.message||''))return spot(u).catch(function(){throw bad});
if(/spotify\.com$/.test(u.hostname)&&err===bad)return spot(u).catch(function(){throw bad});
throw (err&&err.message&&err.name==='Error')?err:bad})}
function resolveU(u){
var h=u.hostname.replace(/^www\./,'');
if(/^(music|itunes)\.apple\.com$/.test(h))return apple(u);
if(/^(spotify\.link|vk\.cc|vk\.me|clck\.ru|ya\.cc)$/.test(h))return Promise.reject(new Error('Это короткая ссылка. Откройте её и скопируйте полную или впишите трек вручную'));
if(/(^|\.)vk\.(com|ru)$/.test(h))return Promise.reject(new Error('VK пока не поддерживается. Впишите «Артист — Трек» вручную'));
return odesli(u)}
function findT(){
var v=(TV||'').trim();if(!v||TBUSY)return;
TERR='';TI=null;var u=urlOf(v);
if(!u){TI=manual(v);if(TL)TI.url=TL;TN='';render();return}
var hn=u.hostname.replace(/^www\./,''),hs=/^music\.yandex\./.test(hn)?'Яндекс Музыка':(/(^|\.)vk\.(com|ru)$/.test(hn)?'VK':'');
if(hs){TL=u.href;TV='';TN=hs+' не отдаёт данные трека. Впишите «Артист — Трек», а ссылку я сохраню';render();return}
TL='';TN='';
TBUSY=true;render();
resolveU(u).then(function(t){TI=t;TBUSY=false;render()},function(e){TBUSY=false;TERR=(e&&e.message)||'Не удалось получить трек';render()});
}
function pasteT(){
var fail=function(){toast('Нажмите на поле и выберите «Вставить»')};
try{navigator.clipboard.readText().then(function(t){TV=t||'';TERR='';render();if(urlOf(TV))findT()},fail)}catch(e){fail()}
}

function leaders(){var m=Math.max.apply(null,S.players.map(function(p){return p.score}));var r=[];S.players.forEach(function(p,i){if(p.score===m)r.push(i)});return r}
function tiebreak(){
var L=leaders(),n=S.players.length,j=-1;
for(var i=0;i<n;i++){if(L.indexOf(i)<0){j=i;break}}
if(j<0)j=S.round%n;
S.tb=true;S.sn=false;S.leaders=L;S.tbJudge=j;S.round++;S.card=null;S.phase='roll';S.rolls=[];S.sel=[];save();render();
}
function reset(){S=null;try{localStorage.removeItem(KEY)}catch(e){}saved=null;screen='menu';render()}
function ask(){var f=function(ok){if(ok)reset()};if(TG&&TG.showConfirm)TG.showConfirm('Закончить игру?',f);else f(confirm('Закончить игру?'))}
function board(j){
var max=Math.max(1,Math.max.apply(null,S.players.map(function(p){return p.score})));
var h='<h2 style="margin-top:12px">Очки</h2>';
S.players.map(function(p,i){return {p:p,i:i}}).sort(function(a,b){return b.p.score-a.p.score}).forEach(function(o){
h+='<div class="row">'+av(o.p.name,o.i)+'<div class="b">'+esc(o.p.name)+(j&&o.i===judgeIdx()?' ⚖️':'')+'<div class="bar"><i style="width:'+(Math.max(0,o.p.score)/max*100)+'%"></i></div></div><b>'+fmt(o.p.score)+'</b></div>'});
return h;
}
function sheet(){
var o=document.createElement('div');o.className='ov';o.onclick=closeOv;
o.innerHTML='<div class="sh" onclick="event.stopPropagation()">'+board(true)+((S.hist&&S.hist.length)?'<button onclick="hist()">История раундов</button>':'')+'<button class="ghost" onclick="closeOv()">Закрыть</button></div>';document.body.appendChild(o);
}
function confetti(){
var e=['🎉','🎶','✨','🎧','🎵','💜'],h='';
for(var i=0;i<26;i++)h+='<span class="cft" style="left:'+Math.random()*100+'%;animation-duration:'+(2.5+Math.random()*2.5)+'s;animation-delay:'+Math.random()*1.2+'s">'+e[i%e.length]+'</span>';
var d=document.createElement('div');d.innerHTML=h;document.body.appendChild(d);setTimeout(function(){d.remove()},7000);
}
function winMas(i){var p=S.players[i],t=p.seeds&&p.seeds.length>1;return '<div class="wmas'+(t?' tm':'')+'"'+(t?' style="--n:'+p.seeds.length+'"':'')+'>'+(t?p.seeds.map(function(sd){return mascotSVG(sd)}).join(''):mascot(i))+'</div>'}
function final(){
var L=leaders(),h='<h1>Итоги</h1>';
if(L.length===1){var i=L[0];h+='<div class="wcard"><span class="wbadge">'+(i+1)+'</span><div class="wtop">Победитель!</div>'+winMas(i)+'<div class="wname">'+esc(S.players[i].name)+' 👑</div></div><div class="mu" style="text-align:center;color:var(--ink)">'+fmt(S.players[i].score)+' очк.</div><div class="glass">';setTimeout(confetti,200)}
else h+='<div class="glass"><div class="trophy">🤝</div><div class="big">Ничья</div><div class="mu" style="text-align:center">'+L.map(function(i){return esc(S.players[i].name)}).join(', ')+'</div><button onclick="tiebreak()">Дополнительный раунд</button></div><div class="glass">';
h+=board(false)+'</div>'+((S.hist&&S.hist.length)?'<button onclick="hist()">История раундов</button>':'')+'<button class="ghost" onclick="reset()">В меню</button>';
$.innerHTML=h;
}
function draw(){
if(screen==='intro')return intro();
if(screen==='menu')return menu();
if(!S){screen='menu';return menu()}
game();
}
function render(){draw()}
render();
